  - paragraph: 段落之间使用空行分隔。
  - paragraph:
    - text: 第二段。
    - emphasis: 斜体
    - text: 、
    - strong: 粗体
    - text: ，以及
    - code: 等宽文本
    - text: 。无序列表看起来像这样：
  - list:
    - listitem: 第一项
    - listitem: 第二项
    - listitem: 第三项
  - paragraph: 请注意，正文内容会从缩进 4 个空格之后开始。
  - blockquote:
    - paragraph: 引用块 可以这样写。
    - paragraph: 如果需要， 也可以跨越多个段落。
  - paragraph: /用 3 个连字符表示破折号。用 2 个连字符表示范围（例如“第 \d+—\d+ 章”）。三个点 … 会被转换为省略号。 支持 Unicode。☺/
  - 'heading "二级标题 #" [level=2]':
    - text: ""
    - link "#":
      - /url: "#二级标题"
  - paragraph: 下面是一个有序列表：
  - list:
    - listitem: 第一项
    - listitem: 第二项
    - listitem: 第三项
  - paragraph: 再次注意，正文会从左侧第 4 列开始，也就是缩进 4 个字符。下面是一个代码示例：
  - figure:
    - text: plaintext
    - code: "/# 再强调一次…… for i in 1 \\.\\. \\d+ \\{ do-something\\(i\\) \\}/"
    - button "Copy code":
      - img
      - img
  - paragraph: 如你所见，这里用了 4 个空格缩进。除此之外，你也可以不用缩进，而是改用围栏代码块：
  - figure:
    - text: plaintext
    - code: "define foobar() { print \"欢迎来到示例世界！\"; }"
    - button "Copy code":
      - img
      - img
  - paragraph: 这样复制和粘贴会更方便。你也可以额外给围栏代码块标记语言，让 Pandoc 执行语法高亮：
  - figure:
    - text: python
    - code: "/import time # 快一点，开始数到十！ for i in range\\(\\d+\\): # （不过别太快） time\\.sleep\\(0\\.5\\) print\\(i\\)/"
    - button "Copy code":
      - img
      - img
  - 'heading "三级标题 #" [level=3]':
    - text: ""
    - link "#":
      - /url: "#三级标题"
  - paragraph: 下面是一个嵌套列表示例：
  - list:
    - listitem:
      - paragraph: 先准备这些食材：
      - list:
        - listitem: 胡萝卜
        - listitem: 芹菜
        - listitem: 扁豆
    - listitem:
      - paragraph: 烧一锅水。
    - listitem:
      - paragraph: 把所有东西都倒进锅里，然后按下面这个流程操作：
      - figure:
        - text: plaintext
        - code: /找到木勺 打开锅盖 搅拌 盖上锅盖 小心地把木勺架在锅柄上 等 \d+ 分钟 回到第一步（或者煮好后关火）/
        - button "Copy code":
          - img
          - img
      - paragraph: 不要碰到木勺，否则它会掉下来。
  - paragraph: 再看一次，正文总是会和 4 空格缩进对齐，包括上面接在第 3 项后面的那一行。
  - paragraph:
    - text: 这里有一个指向
    - link "某个网站":

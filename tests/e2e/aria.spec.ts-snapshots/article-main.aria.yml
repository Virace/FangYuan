        - /url: "#user-content-fn-1"
    - text: 。
  - paragraph: 表格可以这样写：
  - paragraph: 尺码 材质 颜色
  - separator
  - paragraph: /9 皮革 棕色 \d+ 麻布 原色 \d+ 玻璃 透明/
  - paragraph: 表：鞋子、尺码以及材质
  - paragraph: 上面这一行就是表格标题。Pandoc 还支持多行表格：
  - separator
  - paragraph: 关键词 文本
  - separator
  - paragraph: 红色 日落、苹果，以及 其他偏红的 东西。
  - paragraph: 绿色 树叶、草地、青蛙， 还有那些当绿色 并不轻松的东西。
  - separator
  - paragraph: 接下来是一条分隔线。
  - separator
  - paragraph: 下面是一个定义列表：
  - paragraph:
    - text: "苹果 : 适合拿来做苹果酱。 橙子 : 典型的柑橘类水果。 番茄 : 英文 tomato 里没有多余的"
    - code: e
    - text: 。
  - paragraph: 这里的正文同样缩进 4 个空格。（如果你想让版面更松一些，可以在每组术语和定义之间加一个空行。）
  - paragraph: 下面是一个“行块”：
  - paragraph: "| 第一行 | 第二行 | 第三行"
  - paragraph: 图片也可以这样写：
  - paragraph:
    - text: 行内数学公式可以这样写：
    - math: ω = d ϕ / d t
    - text: 。独立成块的数学公式通常单独占一行，并放在双美元符号之间：
  - paragraph:
    - math: I = ∫ ρ R 2 d V
  - math: /π = \d+\.\d+ \d+ \d+ \d+ \d+ \d+ \d+ \d+ \d+ \d+ …/
